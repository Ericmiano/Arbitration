name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aak_arbitration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent && break
            sleep 2
          done

      - name: Load schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot aak_arbitration_test < schema.sql

      - name: Write test env
        working-directory: server
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3099
          CORS_ORIGIN=http://localhost:5173
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/aak_arbitration_test"
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=root
          DB_NAME=aak_arbitration_test
          SESSION_SECRET=ci-session-secret-not-for-production-0000000000
          DOCUMENT_STORAGE_PATH=./tests/tmp-storage
          MAX_UPLOAD_MB=25
          EOF

      - name: Type-check and build
        working-directory: server
        run: npm run build

      - name: Run tests
        working-directory: server
        run: npm test

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Type-check and build
        working-directory: client
        run: npm run build
